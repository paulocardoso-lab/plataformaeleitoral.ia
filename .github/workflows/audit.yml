name: Audit configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate JavaScript syntax
        run: |
          node --check runtime-config.js
          node --check service-worker.js
          node --check scripts/audit-config.mjs
          node --check scripts/audit-accessibility.mjs
          node --check scripts/healthcheck-production.mjs
          node --check scripts/test-election-features.mjs
          test ! -f dataset_v2.b64
      - name: Audit endpoints, versions and cache
        run: node scripts/audit-config.mjs
      - name: Audit accessibility and mobile-first rules
        run: node scripts/audit-accessibility.mjs
      - name: Test election rendering rules
        run: node scripts/test-election-features.mjs
