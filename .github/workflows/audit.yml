name: Audit configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check runtime-config.js
          node --check service-worker.js
          node --check scripts/audit-config.mjs
          node --check scripts/healthcheck-production.mjs
          test ! -f dataset_v2.b64
      - name: Audit endpoints, versions and cache
        run: node scripts/audit-config.mjs
